[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-games-and-logic-solvers"
version = "0.1.0"
description = "A portfolio repository of classical AI game agents and logic solvers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pillow>=10.0.0",
  "pygame>=2.5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
